# The project's page (site/) on GitHub Pages, with the ROM built from this
# commit beside it (AGENTS.md §2: the ROM is build output, never committed).
# WebMSX loads it from the page's own address. Enable it once in the
# repository's Settings > Pages: Source "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the ROM
        run: ./build.sh
      - name: The page and the ROM
        run: |
          mkdir -p _site
          cp site/* _site/
          cp build/wulfquest.rom _site/wulfquest.rom
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
